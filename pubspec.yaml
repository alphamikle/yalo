name: yalo
description: Yalo (Yaml localizations) - is a package, which give you a simplest way to get localizations from yaml files
version: 4.0.0
homepage: https://github.com/alphamikle/yalo

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.18.1
  dart_style: ^2.3.1
  yaml: ^3.1.2
  path: ^1.8.3
  analyzer: ^5.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  assets:
    - assets/
